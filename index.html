<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tesla Light Show Maker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚡</span>
      <div class="brand-text">
        <h1>Tesla Light Show Maker</h1>
        <span class="tag">Custom · Beat-sync · Web tabanlı</span>
      </div>
    </div>
    <div class="actions">
      <button id="loadAudioBtn" title="Şarkı yükle (mp3 / wav / m4a / ogg)">🎵 Şarkı</button>
      <input type="file" id="audioFile" accept="audio/*" hidden />
      <button id="autoGenBtn" class="primary" title="Beat'leri analiz et ve seçili pattern ile show üret">✨ Otomatik Üret</button>
      <button id="clearBtn" title="Tüm kanalları sıfırla">🗑 Temizle</button>
      <span class="sep"></span>
      <button id="exportFseqBtn" title="Tesla için lightshow.fseq indir">⤓ .fseq</button>
      <button id="exportWavBtn" title="lightshow.wav indir">⤓ .wav</button>
      <span class="sep"></span>
      <button id="saveProjectBtn" title="Projeyi JSON olarak indir">💾 Proje</button>
      <button id="loadProjectBtn" title="JSON proje aç">📂 Aç</button>
      <input type="file" id="projectFile" accept=".json,application/json" hidden />
    </div>
  </header>

  <main class="workspace">
    <section class="left-pane">
      <div class="visualizer card">
        <header class="card-h">
          <h3>Canlı Önizleme</h3>
          <span id="frameDisplay" class="muted small">frame 0 / 0</span>
        </header>
        <div class="svg-wrap">
          <svg id="teslaSvg" viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" aria-label="Tesla üstten görünüm">
            <rect x="120" y="40" width="360" height="240" rx="80" ry="80" class="body" />
            <rect x="200" y="80" width="200" height="160" rx="40" ry="40" class="cabin" />
            <line x1="300" y1="80" x2="300" y2="240" class="cabin-line" />

            <circle data-ch="6"  cx="160" cy="60"  r="12" class="light headlight" data-name="Far Sol İç" />
            <circle data-ch="7"  cx="135" cy="68"  r="10" class="light headlight" data-name="Far Sol Dış" />
            <circle data-ch="8"  cx="440" cy="60"  r="12" class="light headlight" data-name="Far Sağ İç" />
            <circle data-ch="9"  cx="465" cy="68"  r="10" class="light headlight" data-name="Far Sağ Dış" />
            <rect   data-ch="10" x="270" y="46"   width="60" height="6" rx="3" class="light highbeam" data-name="Uzun Far" />
            <rect   data-ch="11" x="180" y="48"   width="40" height="4" rx="2" class="light fog" data-name="Sis Sol" />
            <rect   data-ch="11" x="380" y="48"   width="40" height="4" rx="2" class="light fog" data-name="Sis Sağ" />

            <rect data-ch="12" x="135" y="260" width="60" height="14" rx="4" class="light tail" data-name="Stop Sol" />
            <rect data-ch="13" x="405" y="260" width="60" height="14" rx="4" class="light tail" data-name="Stop Sağ" />
            <rect data-ch="14" x="270" y="266" width="60" height="6"  rx="3" class="light reverse" data-name="Geri Vites" />
            <rect data-ch="15" x="285" y="276" width="30" height="4"  rx="2" class="light plate" data-name="Plaka" />

            <rect data-ch="0" x="115" y="48"  width="14" height="60" rx="6" class="light outline" data-name="Outline Sol Ön" />
            <rect data-ch="1" x="471" y="48"  width="14" height="60" rx="6" class="light outline" data-name="Outline Sağ Ön" />
            <rect data-ch="2" x="115" y="130" width="14" height="60" rx="6" class="light outline" data-name="Outline Sol Yan" />
            <rect data-ch="3" x="471" y="130" width="14" height="60" rx="6" class="light outline" data-name="Outline Sağ Yan" />
            <rect data-ch="4" x="115" y="212" width="14" height="60" rx="6" class="light outline" data-name="Outline Sol Arka" />
            <rect data-ch="5" x="471" y="212" width="14" height="60" rx="6" class="light outline" data-name="Outline Sağ Arka" />

            <circle data-ch="16" cx="128" cy="40"  r="6" class="light signal" data-name="Sinyal Sol" />
            <circle data-ch="17" cx="472" cy="40"  r="6" class="light signal" data-name="Sinyal Sağ" />
            <circle data-ch="18" cx="128" cy="160" r="5" class="light signal" data-name="Yan Sinyal Sol" />
            <circle data-ch="19" cx="472" cy="160" r="5" class="light signal" data-name="Yan Sinyal Sağ" />

            <rect data-ch="20" x="200" y="105" width="6" height="40" class="light closure" data-name="Kapı Ön Sol" />
            <rect data-ch="21" x="394" y="105" width="6" height="40" class="light closure" data-name="Kapı Ön Sağ" />
            <rect data-ch="22" x="200" y="175" width="6" height="40" class="light closure" data-name="Kapı Arka Sol" />
            <rect data-ch="23" x="394" y="175" width="6" height="40" class="light closure" data-name="Kapı Arka Sağ" />
            <rect data-ch="24" x="208" y="100" width="38" height="4" class="light closure" data-name="Pencere Sol Ön" />
            <rect data-ch="25" x="354" y="100" width="38" height="4" class="light closure" data-name="Pencere Sağ Ön" />
            <rect data-ch="26" x="270" y="244" width="60" height="8" class="light closure" data-name="Bagaj" />
            <rect data-ch="27" x="270" y="68"  width="60" height="8" class="light closure" data-name="Frunk" />
            <circle data-ch="28" cx="105" cy="240" r="5" class="light closure" data-name="Şarj Portu" />
            <rect data-ch="29" x="178" y="135" width="6" height="22" class="light closure" data-name="Aynalar" />
          </svg>
        </div>
      </div>

      <div class="card transport">
        <button id="playBtn" class="big">▶</button>
        <button id="stopBtn" class="big">■</button>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" />
        <span id="timeDisplay" class="mono">0:00.0 / 0:00.0</span>
        <span id="bpmDisplay" class="badge">BPM: --</span>
        <span id="beatsDisplay" class="badge">beats: 0</span>
      </div>

      <div class="card pattern-card">
        <header class="card-h"><h3>Otomatik Pattern</h3></header>
        <div class="pattern-grid">
          <label>Stil
            <select id="patternStyle">
              <option value="strobe">Strobe — tüm outline beat'te</option>
              <option value="chase" selected>Chase — sıralı dönen</option>
              <option value="wave">Wave — ön → yan → arka</option>
              <option value="random">Random — rastgele subset</option>
              <option value="beatdrop">Beat Drop — 4'lükte patlama</option>
              <option value="symmetric">Symmetric — sol/sağ ayna</option>
            </select>
          </label>
          <label>Hassasiyet <span id="sensVal" class="muted small">5</span>
            <input type="range" id="sensitivity" min="1" max="10" value="5" />
          </label>
          <label>Beat süresi (frame)
            <input type="number" id="pulseLen" min="1" max="20" value="2" />
          </label>
          <label class="check"><input type="checkbox" id="includeClosures" />
            Closure'ları (kapı/pencere/bagaj) dahil et
          </label>
          <label class="check"><input type="checkbox" id="autoSignals" checked />
            Sinyalleri ritime kat
          </label>
        </div>
      </div>
    </section>

    <section class="right-pane card">
      <header class="card-h">
        <h3>Zaman Çizelgesi <span class="muted small">(50 ms grid · tıkla / sürükle)</span></h3>
        <div class="zoom">
          <button id="zoomOut">−</button>
          <span id="zoomLabel" class="mono">8 px / frame</span>
          <button id="zoomIn">＋</button>
        </div>
      </header>
      <div id="timelineWrap">
        <div class="ruler-wrap">
          <canvas id="rulerCanvas" height="22"></canvas>
        </div>
        <div class="wave-wrap">
          <canvas id="waveformCanvas" height="56"></canvas>
        </div>
        <div class="grid-scroll" id="gridScroll">
          <div class="channel-labels" id="channelLabels"></div>
          <canvas id="gridCanvas"></canvas>
          <div class="playhead" id="playhead"></div>
        </div>
      </div>
      <footer class="hint">
        <span>💡 İpucu: Hücreye <b>tıkla</b> aç/kapat · <b>sürükle</b> ile boya · <b>Shift+sürükle</b> ile sil</span>
      </footer>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
